name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: york-x86_64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: york-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: york-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: york-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p york_cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -e
          OUT="target/${{ matrix.target }}/release"
          DIST="dist/${{ matrix.artifact }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # archive with bin/york.exe inside so installers can find it
            mkdir -p dist_tmp/bin
            cp "$OUT/york.exe" dist_tmp/bin/york.exe
            (cd dist_tmp && 7z a -tzip "../$DIST" bin/york.exe)
            rm -rf dist_tmp
          else
            tar -czf "$DIST" -C "$OUT" york
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble dist
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true