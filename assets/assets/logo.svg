<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgTexture" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="70%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="yGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="300" rx="24" fill="url(#bgTexture)"/>
  <ellipse cx="400" cy="150" rx="320" ry="110" fill="#1e293b" opacity="0.4" filter="url(#glow)"/>
  
  <g transform="translate(85, 75)">
    <path d="M 15,20 L 65,85 L 65,115 L 45,115 L 0,60 Z" fill="url(#yGrad)" filter="url(#glow)"/>
    <path d="M 115,20 L 65,85 L 65,115 L 85,115 L 130,55 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 55,100 L 75,100 L 75,150 L 55,150 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <text x="245" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" letter-spacing="14" fill="#ffffff" filter="url(#glow)">YORK</text>
  <text x="245" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" letter-spacing="14" fill="#ffffff">YORK</text>
</svg>